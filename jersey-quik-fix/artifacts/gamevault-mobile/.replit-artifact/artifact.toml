kind = "mobile"
previewPath = "/gamevault-mobile/"
title = "GameVault Mobile"
description = "A mobile companion app for GameVault — a local game and electronics repair shop. Lets customers book repair tickets step-by-step, browse the product shop with category filters, and check upcoming community events and announcements."
version = "1.0.0"
id = "artifacts/gamevault-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/gamevault-mobile/" ]
localPort = 20065

[services.development]
run = "pnpm --filter @workspace/gamevault-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gamevault-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gamevault-mobile", "run", "serve" ]

[services.env]
PORT = "20065"
BASE_PATH = "/gamevault-mobile/"
