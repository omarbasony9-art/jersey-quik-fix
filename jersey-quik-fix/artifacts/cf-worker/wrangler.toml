name = "jersey-quik-fix"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Static Frontend Assets ──────────────────────────────────────────────────
# Point at the built gamevault frontend.
# Run `pnpm --filter @workspace/gamevault run build` first.
# The SPA fallback means any path not matching a real file serves index.html.
[assets]
directory = "../gamevault/dist/public"
not_found_handling = "single-page-application"
# Required to expose c.env.ASSETS inside the Worker (for SPA fallback routing)
binding = "ASSETS"
# CRITICAL: run the Worker script before consulting static assets.
# Without this flag, Cloudflare serves index.html for every request that
# doesn't match a static file (including all /api/* routes), so the Worker
# code never executes and all API calls return the SPA shell.
run_worker_first = true

# ── D1 Database ─────────────────────────────────────────────────────────────
# Replace database_id with the real ID from:
#   wrangler d1 create jersey-quik-fix-d1
[[d1_databases]]
binding = "DB"
database_name = "jersey-quik-fix-d1"
database_id = "1e526c4e-aa64-4efb-9e52-b8028af7fba0"

# ── R2 Object Storage ────────────────────────────────────────────────────────
# Stores product images uploaded via the admin dashboard.
# Create the bucket first: wrangler r2 bucket create jqf-product-images
[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "jqf-product-images"

# ── Migrations directory ─────────────────────────────────────────────────────

# ── Worker Secrets (set via `wrangler secret put <NAME>`) ───────────────────
# SESSION_SECRET        — admin JWT signing secret (same as Render backend)
# ADMIN_PASSWORD        — admin login password
# STRIPE_SECRET_KEY     — Stripe secret key (sk_live_... or sk_test_...)
# STRIPE_WEBHOOK_SECRET — Stripe webhook signing secret (whsec_...)
# CLERK_SECRET_KEY      — Clerk secret key (sk_live_... or sk_test_...)

# ── Non-secret vars (set in wrangler.toml or via dashboard) ─────────────────
# Uncomment and fill in after you know the deployed Cloudflare URL:
[vars]
FRONTEND_URL = "https://jersey-quik-fix.jersey-quik-fix.workers.dev"
CLERK_PUBLISHABLE_KEY = "pk_test_aW50ZWdyYWwtcHJpbWF0ZS03NS5jbGVyay5hY2NvdW50cy5kZXYk"
